# Packages installed by .chezmoiscripts/run_onchange_before_10-install-packages.sh.tmpl
# on Arch-based systems whenever this file changes. Everything is installed with
# --needed, so already-present packages are skipped.
#
# Keep this to what you want on day one of a new machine. The desktop environment
# and the distro's own meta packages are left to the installer.
packages:
  pacman:
    cli:
      - base-devel
      - btop
      - ripgrep
      - fastfetch
      - wget
      - neovim
      - vim
      - tmux
      - direnv
      - git
      - git-lfs
      - github-cli
      - meld
      - tree-sitter-cli
      - yt-dlp
      - chezmoi
      - openssh
      - tailscale
    dev:
      - docker
      - docker-compose
      - go
      - delve
      - nvm
      - uv
      - python
      - python-pip
      - duckdb
      - aws-cli-v2
      - code
      - claude-code
      - gemini-cli
    terminals:
      - ghostty
      - alacritty
      - kitty
    fonts:
      - ttf-meslo-nerd
    desktop:
      - firefox
      - chromium
      - gimp
      - vlc
      - filezilla
  aur:
    - 1password
    - 1password-cli
    - opencode-bin
    - crush-bin
    - playwright-cli
    - typora
  # Host-specific hardware/driver packages, keyed by hostname.
  hosts:
    d-tux2:
      pacman:
        - davinci-resolve
        - opencl-mesa
        - rocm-smi-lib
        - fprintd
      aur:
        - tuxedo-drivers-dkms
        - tuxedo-control-center-bin
        - tuxedo-yt6801-dkms-git
        - displaylink
        - evdi-dkms
        - amdxdna-driver-bin
        # - libfprint-cs9711-git  # PKGBUILD's prepare() force-merges a stale sigfm fork branch into
        # current libfprint master and now conflicts (2026-09-03); re-enable once AUR pkg is fixed
